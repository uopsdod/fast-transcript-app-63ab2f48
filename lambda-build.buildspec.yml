# M4 helper buildspec — packages the Lambda distributor + its deps layer and
# uploads them to S3. Runs in CodeBuild (which has S3 connectivity) because the
# Cowork sandbox can't reach S3.
# Invoke via: aws codebuild start-build --project-name subtitle-worker-build \
#              --buildspec-override lambda-build.buildspec.yml
#
# Commands are quoted because the pip flag --only-binary=:all: contains a
# colon-space sequence that YAML otherwise mis-parses as a nested mapping.
version: 0.2
phases:
  build:
    commands:
      - "mkdir -p layer/python"
      - "pip install --target layer/python --platform manylinux2014_x86_64 --only-binary=:all: --python-version 3.12 --implementation cp --abi cp312 supabase boto3"
      - "(cd layer && zip -qr ../deps-layer.zip python)"
      - "cp worker/lambda_distributor.py handler.py"
      - "zip -q handler.zip handler.py"
      # ARTIFACTS_BUCKET is set per-project by the CodeBuild project env so this
      # buildspec works against any AWS account without code changes.
      - "aws s3 cp deps-layer.zip s3://${ARTIFACTS_BUCKET}/deps-layer.zip"
      - "aws s3 cp handler.zip s3://${ARTIFACTS_BUCKET}/handler.zip"
      - "echo DONE"
